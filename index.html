<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whiteboard</title>
<style>
:root {
  --bg: #f0eff0;
  --surface: #fff;
  --border: #e0dedd;
  --text: #1a1a1a;
  --muted: #999;
  --accent: #2563eb;
  --accent-h: #1d4ed8;
  --danger: #dc2626;
  /* desktop top bar */
  --dth: 52px;
  /* mobile bottom bar */
  --mbh: 60px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  -webkit-tap-highlight-color: transparent;
}

/* ═══════════════════════════════════════
   DESKTOP TOOLBAR (top, horizontal)
═══════════════════════════════════════ */
#toolbar {
  position: fixed;
  top: env(safe-area-inset-top, 0);
  left: 0; right: 0;
  height: var(--dth);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 3px;
  padding: 0 10px; z-index: 100;
  overflow-x: auto; scrollbar-width: none;
}
#toolbar::-webkit-scrollbar { display: none; }
.sep { width: 1px; height: 26px; background: var(--border); flex-shrink: 0; margin: 0 4px; }

/* shared button style */
.tb {
  width: 34px; height: 34px;
  border: none; background: transparent;
  cursor: pointer; border-radius: 7px;
  color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background .1s, color .1s;
  -webkit-user-select: none; user-select: none;
}
.tb:hover { background: var(--bg); color: var(--text); }
.tb.on  { background: #dbeafe; color: var(--accent); }
.tb svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.tb.danger { color: var(--danger); }
.tb.danger:hover { background: #fef2f2; }
.tb.save-btn {
  background: var(--accent); color: #fff;
  width: auto; padding: 0 12px; gap: 5px;
  font-size: 12px; font-weight: 700; border-radius: 7px;
}
.tb.save-btn:hover { background: var(--accent-h); }
.tb.save-btn svg { stroke: #fff; width: 14px; height: 14px; }

.swatch {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid transparent; cursor: pointer; flex-shrink: 0;
  transition: transform .1s;
}
.swatch:hover { transform: scale(1.18); }
.swatch.on { box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--text); }

input[type=color].cp {
  width: 26px; height: 26px; border: none; background: none;
  cursor: pointer; padding: 0; border-radius: 50%; flex-shrink: 0;
}
input[type=range].sz {
  -webkit-appearance: none;
  height: 4px; border-radius: 2px;
  background: var(--border); outline: none; cursor: pointer; flex-shrink: 0;
}
input[type=range].sz::-webkit-slider-thumb {
  -webkit-appearance: none; width: 13px; height: 13px;
  border-radius: 50%; background: var(--text); cursor: pointer;
}
.szlbl { font-size: 11px; color: var(--muted); min-width: 20px; flex-shrink: 0; }
#fname { font-size: 11px; color: var(--muted); max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
#szSlider { width: 72px; }

/* ═══════════════════════════════════════
   CANVAS AREA
═══════════════════════════════════════ */
#wrap {
  position: fixed;
  top: var(--dth);
  left: 0; right: 0;
  bottom: 0;
  touch-action: none; overflow: hidden;
}
#c { display: block; width: 100%; height: 100%; background: #fff; touch-action: none; }

/* ═══════════════════════════════════════
   SELECTION & RESIZE HANDLES
═══════════════════════════════════════ */
#selBox {
  position: absolute;
  pointer-events: none;
  border: 1.5px dashed var(--accent);
  display: none;
  z-index: 10;
}
.handle {
  position: absolute;
  width: 10px; height: 10px;
  background: #fff;
  border: 1.5px solid var(--accent);
  border-radius: 2px;
  pointer-events: all;
  transform: translate(-50%, -50%);
  touch-action: none;
  box-shadow: 0 1px 4px rgba(0,0,0,0.18);
}
/* Touch hit area booster */
.handle::after {
  content: '';
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 26px; height: 26px;
}
#hTL { left: 0; top: 0; cursor: nwse-resize; }
#hTR { left: 100%; top: 0; cursor: nesw-resize; }
#hBL { left: 0; top: 100%; cursor: nesw-resize; }
#hBR { left: 100%; top: 100%; cursor: nwse-resize; }
#hTC { left: 50%; top: 0; cursor: ns-resize; }
#hBC { left: 50%; top: 100%; cursor: ns-resize; }
#hML { left: 0; top: 50%; cursor: ew-resize; }
#hMR { left: 100%; top: 50%; cursor: ew-resize; }

/* ═══════════════════════════════════════
   SHAPE PROP PANEL (floating)
═══════════════════════════════════════ */
#propPanel {
  position: fixed;
  left: 50%; transform: translateX(-50%);
  bottom: calc(var(--mbh) + env(safe-area-inset-bottom, 0px) + 10px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 10px 14px;
  display: none; align-items: center; gap: 9px;
  box-shadow: 0 4px 24px rgba(0,0,0,.13);
  z-index: 200; flex-wrap: wrap; justify-content: center;
  max-width: calc(100vw - 24px);
}
#propPanel.visible { display: flex; }
#propPanel label { font-size: 11px; color: var(--muted); }
#propStroke, #propFill { width: 28px; height: 28px; border: none; background: none; cursor: pointer; padding: 0; border-radius: 50%; }
#propSize { -webkit-appearance: none; width: 80px; height: 4px; border-radius: 2px; background: var(--border); outline: none; cursor: pointer; }
#propSize::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--text); cursor: pointer; }
#propSzLbl { font-size: 11px; color: var(--muted); min-width: 22px; }
#propFilled { cursor: pointer; accent-color: var(--accent); width: 15px; height: 15px; }
.prop-sep { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
#propDelete { background: #fef2f2; border: none; color: var(--danger); padding: 6px 11px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; }

/* ═══════════════════════════════════════
   MOBILE BOTTOM BAR
═══════════════════════════════════════ */
#mbar {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: calc(var(--mbh) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--surface);
  border-top: 1px solid var(--border);
  z-index: 100;
  align-items: center; justify-content: space-around;
  padding-left: 6px; padding-right: 6px;
}
.mtb {
  width: 44px; height: 44px;
  border: none; background: transparent;
  cursor: pointer; border-radius: 10px;
  color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 3px;
  -webkit-user-select: none; user-select: none;
  transition: background .1s, color .1s;
  flex-shrink: 0;
}
.mtb svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.mtb span { font-size: 9px; font-weight: 600; letter-spacing: .2px; pointer-events: none; }
.mtb.on { color: var(--accent); background: #dbeafe; }
.mtb.danger { color: var(--danger); }
.mtb.msave { background: var(--accent); color: #fff; border-radius: 10px; }
.mtb.msave:active { background: var(--accent-h); }

/* MOBILE TOOL DRAWER */
#mDrawer {
  display: none;
  position: fixed;
  bottom: calc(var(--mbh) + env(safe-area-inset-bottom, 0px));
  left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  border-radius: 18px 18px 0 0;
  padding: 14px 16px 16px;
  z-index: 99;
  box-shadow: 0 -4px 24px rgba(0,0,0,.10);
  transform: translateY(100%);
  transition: transform .22s cubic-bezier(.4,0,.2,1);
}
#mDrawer.open { transform: translateY(0); }
.drawer-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 14px; }
.drawer-section { margin-bottom: 14px; }
.drawer-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
.drawer-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.dtool {
  width: 44px; height: 44px;
  border: none; background: var(--bg);
  cursor: pointer; border-radius: 10px;
  color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 3px;
  transition: background .1s, color .1s;
}
.dtool svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.dtool span { font-size: 9px; font-weight: 600; pointer-events: none; }
.dtool.on { background: #dbeafe; color: var(--accent); }

.mswatch {
  width: 30px; height: 30px; border-radius: 50%;
  border: 2px solid transparent; cursor: pointer; flex-shrink: 0;
  transition: transform .1s;
}
.mswatch.on { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--text); }

input[type=color].mcp { width: 30px; height: 30px; border: none; background: none; cursor: pointer; padding: 0; border-radius: 50%; }
input[type=range].msz {
  -webkit-appearance: none; flex: 1;
  height: 5px; border-radius: 3px;
  background: var(--border); outline: none;
}
input[type=range].msz::-webkit-slider-thumb {
  -webkit-appearance: none; width: 20px; height: 20px;
  border-radius: 50%; background: var(--text); cursor: pointer;
  border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.2);
}
.mszlbl { font-size: 13px; color: var(--text); min-width: 28px; text-align: right; font-weight: 600; }

/* ═══════════════════════════════════════
   MODAL & TOAST
═══════════════════════════════════════ */
#overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.32); z-index: 500; align-items: center; justify-content: center; padding: 20px; }
#overlay.open { display: flex; }
#modal { background: #fff; border-radius: 16px; padding: 24px; max-width: 320px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,.18); }
#modal h2 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
#modal p { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
.mbtns { display: flex; gap: 8px; justify-content: flex-end; }
.mbtn { padding: 9px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; }
.mbtn.cancel { background: var(--bg); color: var(--text); }
.mbtn.ok { background: var(--accent); color: #fff; }

#toast {
  position: fixed; left: 50%;
  transform: translateX(-50%) translateY(6px);
  background: #111; color: #fff;
  padding: 8px 18px; border-radius: 20px;
  font-size: 12px; opacity: 0;
  transition: opacity .2s, transform .2s;
  pointer-events: none; z-index: 700; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ═══════════════════════════════════════
   RESPONSIVE BREAKPOINT
═══════════════════════════════════════ */
@media (max-width: 640px) {
  #toolbar { display: none; }
  #mbar { display: flex; }
  #wrap { top: 0; bottom: calc(var(--mbh) + env(safe-area-inset-bottom, 0px)); }
  #propPanel { bottom: calc(var(--mbh) + env(safe-area-inset-bottom, 0px) + 10px); }
  #toast { bottom: calc(var(--mbh) + env(safe-area-inset-bottom, 0px) + 56px); }
  #mDrawer { display: block; }
}
@media (min-width: 641px) {
  #propPanel { bottom: 20px; }
  #toast { bottom: 30px; }
}
</style>
</head>
<body>

<!-- ════════════════════════════════
     DESKTOP TOP TOOLBAR
════════════════════════════════ -->
<div id="toolbar">
  <button class="tb" id="bNew" title="New"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg></button>
  <button class="tb" id="bOpen" title="Open image"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></button>
  <input type="file" id="fileIn" accept="image/*" style="display:none">
  <span id="fname">untitled</span>
  <div class="sep"></div>

  <button class="tb on" id="tPen" title="Pen"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
  <button class="tb" id="tEraser" title="Eraser"><svg viewBox="0 0 24 24"><path d="M20 20H7L3 16l11-11 7 7z"/><path d="M6 11l7 7"/></svg></button>
  <button class="tb" id="tLine" title="Line"><svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/></svg></button>
  <button class="tb" id="tArrow" title="Arrow"><svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="9 5 19 5 19 15"/></svg></button>
  <div class="sep"></div>
  <button class="tb" id="tRect" title="Rectangle"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/></svg></button>
  <button class="tb" id="tCircle" title="Circle"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg></button>
  <button class="tb" id="tTriangle" title="Triangle"><svg viewBox="0 0 24 24"><polygon points="12 3 22 21 2 21"/></svg></button>
  <button class="tb" id="tSelect" title="Select"><svg viewBox="0 0 24 24"><path d="M5 3l14 9-7 2-3 7z"/></svg></button>
  <div class="sep"></div>

  <div class="swatch on" style="background:#1a1a1a" data-c="#1a1a1a"></div>
  <div class="swatch" style="background:#ef4444" data-c="#ef4444"></div>
  <div class="swatch" style="background:#f97316" data-c="#f97316"></div>
  <div class="swatch" style="background:#eab308" data-c="#eab308"></div>
  <div class="swatch" style="background:#22c55e" data-c="#22c55e"></div>
  <div class="swatch" style="background:#2563eb" data-c="#2563eb"></div>
  <div class="swatch" style="background:#9333ea" data-c="#9333ea"></div>
  <div class="swatch" style="background:#fff;border:1.5px solid #ccc" data-c="#ffffff"></div>
  <input type="color" class="cp" id="colorPicker" value="#1a1a1a" title="Custom color">
  <div class="sep"></div>

  <input type="range" class="sz" id="szSlider" min="1" max="60" value="4">
  <span class="szlbl" id="szLabel">4</span>
  <div class="sep"></div>

  <button class="tb" id="bUndo" title="Undo"><svg viewBox="0 0 24 24"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg></button>
  <button class="tb" id="bRedo" title="Redo"><svg viewBox="0 0 24 24"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg></button>
  <button class="tb danger" id="bClear" title="Clear"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg></button>
  <div style="flex:1"></div>
  <button class="tb save-btn" id="bSave">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Save PNG
  </button>
</div>

<!-- ════════════════════════════════
     CANVAS
════════════════════════════════ -->
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="selBox">
    <div class="handle" id="hTL"></div>
    <div class="handle" id="hTR"></div>
    <div class="handle" id="hBL"></div>
    <div class="handle" id="hBR"></div>
    <div class="handle" id="hTC"></div>
    <div class="handle" id="hBC"></div>
    <div class="handle" id="hML"></div>
    <div class="handle" id="hMR"></div>
  </div>
</div>

<!-- ════════════════════════════════
     SHAPE PROPERTIES PANEL
════════════════════════════════ -->
<div id="propPanel">
  <label>Stroke</label>
  <input type="color" id="propStroke" value="#1a1a1a">
  <label>Fill</label>
  <input type="color" id="propFill" value="#ffffff">
  <input type="checkbox" id="propFilled">
  <label for="propFilled">Filled</label>
  <div class="prop-sep"></div>
  <label>Weight</label>
  <input type="range" id="propSize" min="1" max="30" value="3">
  <span id="propSzLbl">3</span>
  <div class="prop-sep"></div>
  <button id="propDelete">Delete</button>
</div>

<!-- ════════════════════════════════
     MOBILE BOTTOM BAR
════════════════════════════════ -->
<div id="mbar">
  <button class="mtb on" id="mActDraw" data-drawer="tools">
    <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    <span>Tools</span>
  </button>
  <button class="mtb" id="mActColor" data-drawer="colors">
    <svg viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="10.5" r="2.5"/><circle cx="8.5" cy="7.5" r="2.5"/><circle cx="6.5" cy="12.5" r="2.5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
    <span>Color</span>
  </button>
  <button class="mtb" id="mActUndo">
    <svg viewBox="0 0 24 24"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
    <span>Undo</span>
  </button>
  <button class="mtb" id="mActRedo">
    <svg viewBox="0 0 24 24"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
    <span>Redo</span>
  </button>
  <button class="mtb" id="mActMore" data-drawer="more">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
    <span>More</span>
  </button>
  <button class="mtb msave" id="mSave">
    <svg viewBox="0 0 24 24" style="stroke:#fff"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    <span>Save</span>
  </button>
</div>

<!-- ════════════════════════════════
     MOBILE DRAWERS
════════════════════════════════ -->
<div id="mDrawer">
  <!-- TOOLS DRAWER -->
  <div id="dTools">
    <div class="drawer-handle"></div>
    <div class="drawer-section">
      <div class="drawer-label">Draw</div>
      <div class="drawer-row">
        <button class="dtool on" id="dtPen"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>Pen</span></button>
        <button class="dtool" id="dtEraser"><svg viewBox="0 0 24 24"><path d="M20 20H7L3 16l11-11 7 7z"/><path d="M6 11l7 7"/></svg><span>Erase</span></button>
        <button class="dtool" id="dtLine"><svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/></svg><span>Line</span></button>
        <button class="dtool" id="dtArrow"><svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="9 5 19 5 19 15"/></svg><span>Arrow</span></button>
      </div>
    </div>
    <div class="drawer-section">
      <div class="drawer-label">Shapes</div>
      <div class="drawer-row">
        <button class="dtool" id="dtRect"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/></svg><span>Rect</span></button>
        <button class="dtool" id="dtCircle"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg><span>Circle</span></button>
        <button class="dtool" id="dtTriangle"><svg viewBox="0 0 24 24"><polygon points="12 3 22 21 2 21"/></svg><span>Triangle</span></button>
        <button class="dtool" id="dtSelect"><svg viewBox="0 0 24 24"><path d="M5 3l14 9-7 2-3 7z"/></svg><span>Select</span></button>
      </div>
    </div>
  </div>

  <!-- COLORS DRAWER -->
  <div id="dColors" style="display:none">
    <div class="drawer-handle"></div>
    <div class="drawer-section">
      <div class="drawer-label">Color</div>
      <div class="drawer-row">
        <div class="mswatch on" style="background:#1a1a1a" data-c="#1a1a1a"></div>
        <div class="mswatch" style="background:#ef4444" data-c="#ef4444"></div>
        <div class="mswatch" style="background:#f97316" data-c="#f97316"></div>
        <div class="mswatch" style="background:#eab308" data-c="#eab308"></div>
        <div class="mswatch" style="background:#22c55e" data-c="#22c55e"></div>
        <div class="mswatch" style="background:#2563eb" data-c="#2563eb"></div>
        <div class="mswatch" style="background:#9333ea" data-c="#9333ea"></div>
        <div class="mswatch" style="background:#fff;border:1.5px solid #ccc" data-c="#ffffff"></div>
        <input type="color" class="mcp" id="mColorPicker" value="#1a1a1a" title="Custom">
      </div>
    </div>
    <div class="drawer-section">
      <div class="drawer-label">Brush size</div>
      <div class="drawer-row">
        <input type="range" class="msz" id="mSzSlider" min="1" max="60" value="4">
        <span class="mszlbl" id="mSzLabel">4</span>
      </div>
    </div>
  </div>

  <!-- MORE DRAWER -->
  <div id="dMore" style="display:none">
    <div class="drawer-handle"></div>
    <div class="drawer-section">
      <div class="drawer-row" style="gap:12px;flex-wrap:wrap">
        <button class="dtool" id="mNew"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg><span>New</span></button>
        <button class="dtool" id="mOpen"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span>Open</span></button>
        <button class="dtool" style="color:var(--danger)" id="mClear"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg><span>Clear</span></button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="overlay">
  <div id="modal">
    <h2 id="mTitle"></h2><p id="mMsg"></p>
    <div class="mbtns">
      <button class="mbtn cancel" id="mCancel">Cancel</button>
      <button class="mbtn ok" id="mOk">Continue</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<input type="file" id="fileIn2" accept="image/*" style="display:none">

<script>
(() => {
'use strict';

// ── CANVAS ──
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('wrap');

let raster = document.createElement('canvas');
let rctx = raster.getContext('2d');
let dpr = window.devicePixelRatio || 1;

// ── STATE ──
let tool = 'pen', color = '#1a1a1a', strokeSize = 4;
let filled = false, fillColor = '#ffffff';
let shapes = [], selectedId = null;
let isDown = false, dragStart = null, dragMode = null;
let activeHandle = null, resizeOrigShape = null, moveOffsets = null;
let snapshot = null;
let strokePoints = [];
let undoStack = [], redoStack = [];
const MAX_H = 40;
let shapeIdCtr = 0, fname = 'untitled';

// ── RESIZE WITH HIGH-DPI (RETINA) SUPPORT ──
function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  dpr = window.devicePixelRatio || 1;
  const rw = Math.round(w * dpr);
  const rh = Math.round(h * dpr);

  const tmp = document.createElement('canvas');
  tmp.width = rw; tmp.height = rh;
  const tc = tmp.getContext('2d');
  tc.fillStyle = '#fff'; tc.fillRect(0, 0, rw, rh);
  if (raster.width > 0) tc.drawImage(raster, 0, 0);
  raster = tmp; rctx = raster.getContext('2d');

  canvas.width = rw; canvas.height = rh;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  redraw();
}
function fillWR() {
  rctx.setTransform(1, 0, 0, 1, 0, 0);
  rctx.fillStyle = '#fff';
  rctx.fillRect(0, 0, raster.width, raster.height);
}

// ── REDRAW ──
function redraw() {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(raster, 0, 0);
  ctx.scale(dpr, dpr);
  shapes.forEach(s => drawShape(ctx, s, s.id === selectedId));
  ctx.restore();
}

function drawShape(c, s, sel) {
  c.save();
  c.lineWidth = s.sw; c.strokeStyle = s.stroke; c.fillStyle = s.fill;
  c.lineCap = 'round'; c.lineJoin = 'round';
  if (s.type === 'rect') {
    c.beginPath(); c.rect(s.x, s.y, s.w, s.h);
    if (s.filled) c.fill(); c.stroke();
  } else if (s.type === 'circle') {
    const rx = Math.abs(s.w) / 2, ry = Math.abs(s.h) / 2;
    c.beginPath();
    c.ellipse(s.x + s.w / 2, s.y + s.h / 2, Math.max(rx, 0.1), Math.max(ry, 0.1), 0, 0, Math.PI * 2);
    if (s.filled) c.fill(); c.stroke();
  } else if (s.type === 'triangle') {
    c.beginPath();
    c.moveTo(s.x + s.w / 2, s.y); c.lineTo(s.x, s.y + s.h); c.lineTo(s.x + s.w, s.y + s.h); c.closePath();
    if (s.filled) c.fill(); c.stroke();
  }
  c.restore();
}

// ── HISTORY ──
function snap() {
  return { raster: rctx.getImageData(0, 0, raster.width, raster.height), shapes: shapes.map(s => ({...s})), selectedId };
}
function saveH() {
  undoStack.push(snap());
  if (undoStack.length > MAX_H) undoStack.shift();
  redoStack = [];
}
function applySnap(sn) {
  raster.width = sn.raster.width; raster.height = sn.raster.height;
  rctx.putImageData(sn.raster, 0, 0);
  shapes = sn.shapes.map(s => ({...s}));
  selectedId = sn.selectedId;
  redraw(); updateSel(); updateProp();
}
function undo() { if (!undoStack.length) return; redoStack.push(snap()); applySnap(undoStack.pop()); }
function redo() { if (!redoStack.length) return; undoStack.push(snap()); applySnap(redoStack.pop()); }

// ── POINTER HELPERS ──
function pos(e) {
  const r = canvas.getBoundingClientRect();
  const src = e.touches && e.touches.length > 0 ? e.touches[0] : (e.changedTouches && e.changedTouches.length > 0 ? e.changedTouches[0] : e);
  return { x: src.clientX - r.left, y: src.clientY - r.top };
}
function hitShape(px, py) {
  for (let i = shapes.length - 1; i >= 0; i--) {
    const s = shapes[i];
    const x1 = Math.min(s.x, s.x + s.w) - 6, y1 = Math.min(s.y, s.y + s.h) - 6;
    const x2 = Math.max(s.x, s.x + s.w) + 6, y2 = Math.max(s.y, s.y + s.h) + 6;
    if (px >= x1 && px <= x2 && py >= y1 && py <= y2) return s;
  }
  return null;
}

// ── SELECTION BOX ──
const selBox = document.getElementById('selBox');
function updateSel() {
  if (!selectedId) { selBox.style.display = 'none'; return; }
  const s = shapes.find(sh => sh.id === selectedId);
  if (!s) { selBox.style.display = 'none'; return; }
  const x1 = Math.min(s.x, s.x + s.w);
  const y1 = Math.min(s.y, s.y + s.h);
  const w = Math.abs(s.w);
  const h = Math.abs(s.h);
  const pad = 4;
  selBox.style.display = 'block';
  selBox.style.left = `${x1 - pad}px`;
  selBox.style.top = `${y1 - pad}px`;
  selBox.style.width = `${w + pad * 2}px`;
  selBox.style.height = `${h + pad * 2}px`;
}

// ── PROP PANEL ──
function updateProp() {
  const p = document.getElementById('propPanel');
  if (!selectedId) { p.classList.remove('visible'); return; }
  const s = shapes.find(sh => sh.id === selectedId); if (!s) { p.classList.remove('visible'); return; }
  p.classList.add('visible');
  document.getElementById('propStroke').value = s.stroke;
  document.getElementById('propFill').value = s.fill || '#ffffff';
  document.getElementById('propFilled').checked = s.filled;
  document.getElementById('propSize').value = s.sw;
  document.getElementById('propSzLbl').textContent = s.sw;
}
document.getElementById('propStroke').oninput = e => { const s = shapes.find(sh => sh.id === selectedId); if (s) { s.stroke = e.target.value; redraw(); } };
document.getElementById('propFill').oninput = e => { const s = shapes.find(sh => sh.id === selectedId); if (s) { s.fill = e.target.value; redraw(); } };
document.getElementById('propFilled').onchange = e => { const s = shapes.find(sh => sh.id === selectedId); if (s) { s.filled = e.target.checked; redraw(); } };
document.getElementById('propSize').oninput = e => { const s = shapes.find(sh => sh.id === selectedId); if (s) { s.sw = parseInt(e.target.value); document.getElementById('propSzLbl').textContent = s.sw; redraw(); updateSel(); } };
document.getElementById('propDelete').onclick = () => {
  if (!selectedId) return;
  saveH(); shapes = shapes.filter(s => s.id !== selectedId);
  selectedId = null; updateSel(); updateProp(); redraw();
};

// ── 8-WAY RESIZE HANDLERS (LIKE A BROWSER WINDOW) ──
const handleMap = {hTL:'TL',hTR:'TR',hBL:'BL',hBR:'BR',hTC:'TC',hBC:'BC',hML:'ML',hMR:'MR'};
Object.entries(handleMap).forEach(([id, hname]) => {
  const el = document.getElementById(id);
  const start = e => {
    e.stopPropagation();
    e.preventDefault();
    if (!selectedId) return;
    saveH();
    activeHandle = hname;
    const target = shapes.find(sh => sh.id === selectedId);
    // Ensure normalized origin coordinates
    resizeOrigShape = {
      ...target,
      x: Math.min(target.x, target.x + target.w),
      y: Math.min(target.y, target.y + target.h),
      w: Math.abs(target.w),
      h: Math.abs(target.h)
    };
    target.x = resizeOrigShape.x;
    target.y = resizeOrigShape.y;
    target.w = resizeOrigShape.w;
    target.h = resizeOrigShape.h;

    dragStart = pos(e);
    dragMode = 'resize';
    isDown = true;
  };
  el.addEventListener('mousedown', start);
  el.addEventListener('touchstart', start, {passive: false});
});

// ── POINTER DOWN ──
function onDown(e) {
  const p = pos(e);
  if (tool === 'select') {
    const hit = hitShape(p.x, p.y);
    if (hit) {
      if (hit.id !== selectedId) {
        selectedId = hit.id;
        updateSel();
        updateProp();
        redraw();
      }
      saveH();
      dragMode = 'move';
      const s = shapes.find(sh => sh.id === selectedId);
      moveOffsets = { ox: p.x - s.x, oy: p.y - s.y };
      dragStart = p;
      isDown = true;
    } else {
      selectedId = null;
      updateSel();
      updateProp();
      redraw();
    }
    return;
  }
  if (['rect', 'circle', 'triangle'].includes(tool)) {
    saveH();
    dragStart = p;
    isDown = true;
    dragMode = 'draw';
    snapshot = rctx.getImageData(0, 0, raster.width, raster.height);
    return;
  }
  if (tool === 'pen' || tool === 'eraser') {
    saveH();
    dragStart = p;
    isDown = true;
    dragMode = 'draw';
    strokePoints = [p];
    setRC(tool === 'eraser');
    rctx.beginPath();
    rctx.arc(p.x, p.y, Math.max(strokeSize / 2, 0.5), 0, Math.PI * 2);
    rctx.fillStyle = tool === 'eraser' ? 'rgba(0,0,0,1)' : color;
    rctx.fill();
    redraw();
    return;
  }
  if (tool === 'line' || tool === 'arrow') {
    saveH();
    dragStart = p;
    isDown = true;
    dragMode = 'draw';
    snapshot = rctx.getImageData(0, 0, raster.width, raster.height);
  }
}

// ── POINTER MOVE (SMOOTH & BOUNDLESS) ──
function onMove(e) {
  if (!isDown) return;
  const p = pos(e);

  // Smooth window-style resize from all 8 handles
  if (dragMode === 'resize' && activeHandle && resizeOrigShape) {
    const s = shapes.find(sh => sh.id === selectedId);
    if (!s) return;
    const o = resizeOrigShape;
    const dx = p.x - dragStart.x;
    const dy = p.y - dragStart.y;
    const minW = 8;
    const minH = 8;
    const origR = o.x + o.w;
    const origB = o.y + o.h;

    if (activeHandle === 'BR') {
      s.w = Math.max(minW, o.w + dx);
      s.h = Math.max(minH, o.h + dy);
    } else if (activeHandle === 'MR') {
      s.w = Math.max(minW, o.w + dx);
    } else if (activeHandle === 'BC') {
      s.h = Math.max(minH, o.h + dy);
    } else if (activeHandle === 'TL') {
      const newX = Math.min(origR - minW, o.x + dx);
      const newY = Math.min(origB - minH, o.y + dy);
      s.x = newX;
      s.y = newY;
      s.w = origR - newX;
      s.h = origB - newY;
    } else if (activeHandle === 'TR') {
      const newY = Math.min(origB - minH, o.y + dy);
      s.y = newY;
      s.w = Math.max(minW, o.w + dx);
      s.h = origB - newY;
    } else if (activeHandle === 'BL') {
      const newX = Math.min(origR - minW, o.x + dx);
      s.x = newX;
      s.w = origR - newX;
      s.h = Math.max(minH, o.h + dy);
    } else if (activeHandle === 'TC') {
      const newY = Math.min(origB - minH, o.y + dy);
      s.y = newY;
      s.h = origB - newY;
    } else if (activeHandle === 'ML') {
      const newX = Math.min(origR - minW, o.x + dx);
      s.x = newX;
      s.w = origR - newX;
    }

    redraw();
    updateSel();
    return;
  }

  if (dragMode === 'move') {
    const s = shapes.find(sh => sh.id === selectedId);
    if (!s) return;
    s.x = p.x - moveOffsets.ox;
    s.y = p.y - moveOffsets.oy;
    redraw();
    updateSel();
    return;
  }

  if (dragMode === 'draw') {
    if (['rect', 'circle', 'triangle'].includes(tool)) {
      rctx.putImageData(snapshot, 0, 0);
      redraw();
      ctx.save();
      ctx.scale(dpr, dpr);
      const curX = Math.min(dragStart.x, p.x);
      const curY = Math.min(dragStart.y, p.y);
      const curW = Math.abs(p.x - dragStart.x);
      const curH = Math.abs(p.y - dragStart.y);
      drawShape(ctx, {type: tool, x: curX, y: curY, w: curW, h: curH, stroke: color, fill: fillColor, filled, sw: strokeSize}, false);
      ctx.restore();
      return;
    }
    if (tool === 'pen' || tool === 'eraser') {
      const lastP = strokePoints[strokePoints.length - 1];
      const distSq = (p.x - lastP.x) ** 2 + (p.y - lastP.y) ** 2;
      if (distSq < 1.5) return;

      strokePoints.push(p);
      const pts = strokePoints;
      setRC(tool === 'eraser');

      if (pts.length === 2) {
        rctx.beginPath();
        rctx.moveTo(pts[0].x, pts[0].y);
        const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
        rctx.lineTo(mid.x, mid.y);
        rctx.stroke();
      } else if (pts.length >= 3) {
        const p0 = pts[pts.length - 3];
        const p1 = pts[pts.length - 2];
        const p2 = pts[pts.length - 1];
        const mid1 = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
        const mid2 = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
        rctx.beginPath();
        rctx.moveTo(mid1.x, mid1.y);
        rctx.quadraticCurveTo(p1.x, p1.y, mid2.x, mid2.y);
        rctx.stroke();
      }
      redraw();
      return;
    }
    if (tool === 'line' || tool === 'arrow') {
      rctx.putImageData(snapshot, 0, 0);
      setRC(false);
      rctx.beginPath(); rctx.moveTo(dragStart.x, dragStart.y); rctx.lineTo(p.x, p.y); rctx.stroke();
      if (tool === 'arrow') drawArrow(rctx, dragStart.x, dragStart.y, p.x, p.y);
      redraw();
    }
  }
}

// ── POINTER UP ──
function onUp(e) {
  if (!isDown) return;
  const p = pos(e);

  if (dragMode === 'resize') {
    activeHandle = null;
    resizeOrigShape = null;
    updateSel();
    updateProp();
    isDown = false;
    dragMode = null;
    return;
  }
  if (dragMode === 'move') {
    isDown = false;
    dragMode = null;
    return;
  }
  if (dragMode === 'draw') {
    if (['rect', 'circle', 'triangle'].includes(tool)) {
      rctx.putImageData(snapshot, 0, 0);
      snapshot = null;
      const x = Math.min(dragStart.x, p.x);
      const y = Math.min(dragStart.y, p.y);
      const w = Math.abs(p.x - dragStart.x);
      const h = Math.abs(p.y - dragStart.y);

      if (w > 4 || h > 4) {
        const ns = {
          type: tool,
          id: ++shapeIdCtr,
          x,
          y,
          w,
          h,
          stroke: color,
          fill: fillColor,
          filled,
          sw: strokeSize
        };
        shapes.push(ns);
        selectedId = ns.id;
        // Switch to select tool so the shape can immediately be resized or moved
        setTool('select');
        updateSel();
        updateProp();
      }
      redraw();
    }
    if (tool === 'pen' || tool === 'eraser') {
      if (strokePoints.length >= 2) {
        const pLast2 = strokePoints[strokePoints.length - 2];
        const pLast1 = strokePoints[strokePoints.length - 1];
        const mid = { x: (pLast2.x + pLast1.x) / 2, y: (pLast2.y + pLast1.y) / 2 };
        setRC(tool === 'eraser');
        rctx.beginPath();
        rctx.moveTo(mid.x, mid.y);
        rctx.lineTo(pLast1.x, pLast1.y);
        rctx.stroke();
      }
      rctx.globalCompositeOperation = 'source-over';
      strokePoints = [];
      redraw();
    }
  }
  isDown = false;
  dragMode = null;
  snapshot = null;
}

function setRC(erase) {
  rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  rctx.lineWidth = strokeSize;
  rctx.lineCap = 'round';
  rctx.lineJoin = 'round';
  if (erase) {
    rctx.globalCompositeOperation = 'destination-out';
    rctx.strokeStyle = 'rgba(0,0,0,1)';
  } else {
    rctx.globalCompositeOperation = 'source-over';
    rctx.strokeStyle = color;
  }
}

function drawArrow(c, x1, y1, x2, y2) {
  const hl = Math.min(24, Math.max(10, strokeSize * 4)), a = Math.atan2(y2 - y1, x2 - x1);
  c.beginPath();
  c.moveTo(x2, y2);
  c.lineTo(x2 - hl * Math.cos(a - Math.PI / 6), y2 - hl * Math.sin(a - Math.PI / 6));
  c.lineTo(x2 - hl * Math.cos(a + Math.PI / 6), y2 - hl * Math.sin(a + Math.PI / 6));
  c.closePath();
  c.fillStyle = color;
  c.globalCompositeOperation = 'source-over';
  c.fill();
}

// ── BIND EVENT LISTENERS TO CANVAS & WINDOW ──
canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('touchstart', onDown, {passive: false});

// Window listeners guarantee smooth handle dragging beyond boundaries
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
window.addEventListener('touchmove', onMove, {passive: false});
window.addEventListener('touchend', onUp, {passive: false});

document.addEventListener('touchmove', e => {
  if (e.target === canvas || e.target.closest('#wrap')) e.preventDefault();
}, {passive: false});

// ── TOOL SYNC ──
const TOOLS = {
  tPen:'pen',tEraser:'eraser',tLine:'line',tArrow:'arrow',
  tRect:'rect',tCircle:'circle',tTriangle:'triangle',tSelect:'select'
};
const DTOOLS = {
  dtPen:'pen',dtEraser:'eraser',dtLine:'line',dtArrow:'arrow',
  dtRect:'rect',dtCircle:'circle',dtTriangle:'triangle',dtSelect:'select'
};
function setTool(t) {
  tool = t;
  Object.entries(TOOLS).forEach(([id, v]) => { const el = document.getElementById(id); if (el) el.classList.toggle('on', v === t); });
  Object.entries(DTOOLS).forEach(([id, v]) => { const el = document.getElementById(id); if (el) el.classList.toggle('on', v === t); });
  const isShape = ['rect', 'circle', 'triangle'].includes(t);
  const isDraw = ['pen', 'eraser', 'line', 'arrow'].includes(t);
  document.getElementById('mActDraw').classList.toggle('on', isDraw || isShape || t === 'select');
  if (t !== 'select') { selectedId = null; updateSel(); updateProp(); redraw(); }
  canvas.style.cursor = t === 'select' ? 'default' : t === 'eraser' ? 'cell' : 'crosshair';
  if (window.innerWidth <= 640) closeDrawer();
}
Object.entries(TOOLS).forEach(([id, t]) => { const el = document.getElementById(id); if (el) el.onclick = () => setTool(t); });
Object.entries(DTOOLS).forEach(([id, t]) => { const el = document.getElementById(id); if (el) el.onclick = () => setTool(t); });

// ── COLORS ──
function setColor(c) {
  color = c;
  document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('on', s.dataset.c === c));
  document.querySelectorAll('.mswatch').forEach(s => s.classList.toggle('on', s.dataset.c === c));
}
document.querySelectorAll('.swatch').forEach(sw => sw.onclick = () => { setColor(sw.dataset.c); document.getElementById('colorPicker').value = color.length === 7 ? color : '#000000'; });
document.querySelectorAll('.mswatch').forEach(sw => sw.onclick = () => { setColor(sw.dataset.c); document.getElementById('mColorPicker').value = color.length === 7 ? color : '#000000'; if (window.innerWidth <= 640) closeDrawer(); });
document.getElementById('colorPicker').oninput = e => { color = e.target.value; document.querySelectorAll('.swatch,.mswatch').forEach(s => s.classList.remove('on')); };
document.getElementById('mColorPicker').oninput = e => { color = e.target.value; document.querySelectorAll('.swatch,.mswatch').forEach(s => s.classList.remove('on')); };

// ── SIZE ──
function syncSize(v) {
  strokeSize = parseInt(v);
  document.getElementById('szSlider').value = v;
  document.getElementById('szLabel').textContent = v;
  document.getElementById('mSzSlider').value = v;
  document.getElementById('mSzLabel').textContent = v;
}
document.getElementById('szSlider').oninput = e => syncSize(e.target.value);
document.getElementById('mSzSlider').oninput = e => syncSize(e.target.value);

// ── MOBILE DRAWER ──
const mDrawer = document.getElementById('mDrawer');
let currentDrawer = null;
function openDrawer(which) {
  document.getElementById('dTools').style.display = which === 'tools' ? '' : 'none';
  document.getElementById('dColors').style.display = which === 'colors' ? '' : 'none';
  document.getElementById('dMore').style.display = which === 'more' ? '' : 'none';
  mDrawer.classList.add('open');
  currentDrawer = which;
  ['mActDraw', 'mActColor', 'mActMore'].forEach(id => {
    document.getElementById(id).classList.remove('on');
  });
  if (which === 'tools') document.getElementById('mActDraw').classList.add('on');
  if (which === 'colors') document.getElementById('mActColor').classList.add('on');
  if (which === 'more') document.getElementById('mActMore').classList.add('on');
}
function closeDrawer() { mDrawer.classList.remove('open'); currentDrawer = null; }

document.getElementById('mActDraw').onclick = () => { if (currentDrawer === 'tools') closeDrawer(); else openDrawer('tools'); };
document.getElementById('mActColor').onclick = () => { if (currentDrawer === 'colors') closeDrawer(); else openDrawer('colors'); };
document.getElementById('mActMore').onclick = () => { if (currentDrawer === 'more') closeDrawer(); else openDrawer('more'); };
document.getElementById('mActUndo').onclick = () => { undo(); closeDrawer(); };
document.getElementById('mActRedo').onclick = () => { redo(); closeDrawer(); };
document.getElementById('mSave').onclick = () => savePNG();

canvas.addEventListener('pointerdown', () => { if (mDrawer.classList.contains('open')) closeDrawer(); });

// ── FILE OPS ──
function doNew() {
  showModal('New canvas', 'Clear the canvas? Unsaved work will be lost.', ok => {
    if (!ok) return;
    saveH(); fillWR(); shapes = []; selectedId = null;
    updateSel(); updateProp(); redraw();
    fname = 'untitled'; updateFname(); toast('New canvas');
  });
}
function doOpen(inputEl) { inputEl.click(); }
function handleFile(file) {
  if (!file) return;
  fname = file.name.replace(/\.[^/.]+$/, ''); updateFname();
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      saveH(); fillWR(); shapes = []; selectedId = null;
      const sc = Math.min(raster.width / img.width, raster.height / img.height, 1);
      const w = img.width * sc, h = img.height * sc;
      rctx.setTransform(1, 0, 0, 1, 0, 0);
      rctx.drawImage(img, (raster.width - w) / 2, (raster.height - h) / 2, w, h);
      updateSel(); updateProp(); redraw();
      toast('Opened: ' + fname);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function savePNG() {
  const exp = document.createElement('canvas');
  exp.width = canvas.width; exp.height = canvas.height;
  const ec = exp.getContext('2d');
  ec.fillStyle = '#fff'; ec.fillRect(0, 0, exp.width, exp.height);
  ec.drawImage(raster, 0, 0);
  ec.scale(dpr, dpr);
  shapes.forEach(s => drawShape(ec, s, false));
  const a = document.createElement('a');
  a.download = (fname || 'whiteboard') + '.png';
  a.href = exp.toDataURL('image/png'); a.click();
  toast('Saved as ' + a.download);
}
function doClear() {
  showModal('Clear canvas', 'Erase everything?', ok => {
    if (!ok) return;
    saveH(); fillWR(); shapes = []; selectedId = null;
    updateSel(); updateProp(); redraw(); toast('Canvas cleared');
  });
}

document.getElementById('bNew').onclick = doNew;
document.getElementById('bOpen').onclick = () => doOpen(document.getElementById('fileIn'));
document.getElementById('bSave').onclick = savePNG;
document.getElementById('bUndo').onclick = undo;
document.getElementById('bRedo').onclick = redo;
document.getElementById('bClear').onclick = doClear;

document.getElementById('mNew').onclick = () => { closeDrawer(); doNew(); };
document.getElementById('mOpen').onclick = () => { closeDrawer(); doOpen(document.getElementById('fileIn2')); };
document.getElementById('mClear').onclick = () => { closeDrawer(); doClear(); };

document.getElementById('fileIn').onchange = e => { handleFile(e.target.files[0]); e.target.value = ''; };
document.getElementById('fileIn2').onchange = e => { handleFile(e.target.files[0]); e.target.value = ''; };

function updateFname() {
  document.getElementById('fname').textContent = fname;
  document.getElementById('fname').title = fname;
}

// ── KEYBOARD ──
window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey) {
    if (e.key === 'z') { e.preventDefault(); undo(); }
    if (e.key === 'y') { e.preventDefault(); redo(); }
    if (e.key === 's') { e.preventDefault(); savePNG(); }
  }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId && document.activeElement === document.body) {
    saveH(); shapes = shapes.filter(s => s.id !== selectedId); selectedId = null; updateSel(); updateProp(); redraw();
  }
  if (!e.ctrlKey && !e.metaKey) {
    const map = {p:'pen', e:'eraser', s:'select', r:'rect', c:'circle'};
    if (map[e.key]) setTool(map[e.key]);
  }
});

// ── MODAL ──
let mcb = null;
function showModal(t, m, cb) {
  document.getElementById('mTitle').textContent = t;
  document.getElementById('mMsg').textContent = m;
  document.getElementById('overlay').classList.add('open');
  mcb = cb;
}
document.getElementById('mCancel').onclick = () => { document.getElementById('overlay').classList.remove('open'); mcb && mcb(false); };
document.getElementById('mOk').onclick = () => { document.getElementById('overlay').classList.remove('open'); mcb && mcb(true); };

// ── TOAST ──
let tt;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── INIT ──
window.addEventListener('resize', resize);
resize(); fillWR(); redraw();
})();
</script>
</body>
</html>
